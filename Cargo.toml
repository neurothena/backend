[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = {version = "2.3.0", features = ["uuid"]}
diesel-async = { version = "0.7.0", features = ["postgres", "bb8"] }
diesel-timescaledb = "0.1"
dotenvy = "0.15.7"
serde = { version = "1.0", features = ["derive"] }
envy = "0.4"
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
thiserror = "2.0.20"
oauth2 = "5.0.0"
oauth-axum = "0.1.4"
axum_responses = "0.5.5"
argon2 = { version = "0.6.0", features = ["password-hash", "rand_core"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = "0.4.45"
strum = { version = "0.28.0", features = ["derive"] }
uuid = { version = "1.26.1", features = ["v4", "fast-rng", "serde"] }
time = "0.3.55"
tower-http = { version = "0.7.1", features = ["catch-panic"] }
serde_json = "1.0.151"
async-trait = "0.1.92"
