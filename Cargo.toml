[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = "2.3.0" # no backend features need to be enabled
diesel-async = { version = "0.7.0", features = ["postgres", "bb8"] }
diesel-timescaledb = "0.1"
dotenvy = "0.15.7"
serde = { version = "1.0", features = ["derive"] }
envy = "0.4"
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
thiserror = "2.0.20"
