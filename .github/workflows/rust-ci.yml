name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose
    
    - name: Check formatting
      run: cargo fmt --check

    - name: Run Clippy
      run: cargo clippy -- -D warnings

  push-image:
    needs: build
    uses: neurothena/github/.github/workflows/push-image.yml@ref
